# Launcher icon (#16). Sources: Penpot "04 · App icon"; regenerate with
# `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  image_path: assets/launcher/icon.png
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#E2591A" # brand-500
  adaptive_icon_foreground: assets/launcher/icon_foreground.png
  # Themed icons on Android 13+: lit facets opaque, shaded ones at half alpha.
  adaptive_icon_monochrome: assets/launcher/icon_monochrome.png
  ios: true
  remove_alpha_ios: true
  # iOS 18 appearances: the dark one keeps a transparent backdrop.
  image_path_ios_dark_transparent: assets/launcher/icon_ios_dark.png
  image_path_ios_tinted_grayscale: assets/launcher/icon_ios_tinted.png
