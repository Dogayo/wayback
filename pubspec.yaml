name: wayback
description: "Wayback — приложение для сохранения местоположения и возвращения к нему по компасу и GPS."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  app_di:
    path: packages/app_di
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  go_router: ^18.1.2
  intl: ^0.20.3
  wayback_design_system:
    path: packages/wayback_design_system
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true

  uses-material-design: true


