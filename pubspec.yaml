name: wayback
description: "Wayback — приложение для сохранения местоположения и возвращения к нему по компасу и GPS."
publish_to: 'none'

version: 1.1.0+3

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  app_di:
    path: packages/app_di
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  go_router: ^18.1.2
  intl: ^0.20.2
  wayback_design_system:
    path: packages/wayback_design_system
  flutter_localizations:
    sdk: flutter
  geolocator: ^14.1.2
  shared_preferences: ^2.5.6
  bloc_concurrency: ^0.3.0
  flutter_compass: ^0.8.1
  app_logger:
    path: packages/app_logger
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  generate: true

  uses-material-design: true


