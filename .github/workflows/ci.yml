# ==============================================================================
# CI
#
# Analyze & Test run on every push and pull request — always, unconditionally.
#
# Builds and Releases happen ONLY on `main`, and ONLY when the commit subject
# matches the grammar below exactly. On any other branch a build trigger is
# validated but not executed, so a typo is caught before the merge.
#
# ------------------------------------------------------------------------------
# COMMIT SUBJECT GRAMMAR (first line of the commit message, exact match)
#
#     build(<targets>): <major>.<minor>.<patch>+<build>
#
#   <targets>  comma-separated, no spaces, no duplicates. Each one of:
#
#       android   release APK. Installable. The default deliverable.
#       ios       release .app for a device, UNSIGNED — cannot be installed
#                 on any iPhone. Opt-in: it only proves the target compiles.
#       sim       debug .app for the iOS Simulator. Opt-in: installable on a
#                 Mac with `xcrun simctl install`, but debug-mode and large.
#
#     `all` is accepted as an alias for `android,ios,sim`.
#
#   Neither `ios` nor `sim` is ever built unless named explicitly, because
#   neither produces an artifact a user can install on a phone. See the
#   CODESIGNING note at the bottom of this file.
#
#   Valid:
#     build(android): 1.4.0+12
#     build(android,sim): 1.4.0+12
#     build(ios): 0.9.1+3
#     build(all): 1.4.0+12
#
#   Invalid — these FAIL the run with an explicit error rather than skipping:
#     build: 1.4.0+12                <- missing (targets)
#     build(android, sim): 1.4.0+12  <- space after comma
#     build(android,android): 1.4.0+12 <- duplicate
#     build(web): 1.4.0+12           <- unknown target
#     build(android): 1.4.0          <- missing +build
#     Build(Android): 1.4.0+12       <- case-sensitive, must be lowercase
#
#   A subject that does not start with `build` is simply not a trigger:
#   no build, no error. Only the SUBJECT (first line) is read.
#
# ------------------------------------------------------------------------------
# VERSION BINDING — three things must agree, or the run fails before building
#
#   1. the version in the commit subject
#   2. `version:` in pubspec.yaml
#   3. a `## [<version>] - <date>` section in CHANGELOG.md
#
#   The version is passed to Flutter as --build-name / --build-number, so the
#   shipped binary cannot disagree with the repo. Bump all three together.
#
# ------------------------------------------------------------------------------
# TAGS AND RELEASES — created by CI, never by hand
#
#   After the builds succeed on `main`, CI tags the commit `v<version>` and
#   publishes a GitHub Release with that tag, the CHANGELOG section as its
#   notes, and whichever artifacts were built attached.
#
#   The tag is created AFTER a green build, so a tag always points at a commit
#   that actually builds. Re-releasing an existing version is refused.
#   Tags pushed by CI use GITHUB_TOKEN and therefore do not re-trigger CI.
#
# ------------------------------------------------------------------------------
# CODESIGNING
#
#   Team PX65354M6J has no Apple Developer Program membership, so no
#   distribution certificate or App Store profile can be issued and CI cannot
#   sign anything. Until the account is enrolled:
#     - `ios` yields an unsigned device .app — not installable, compile check only
#     - `sim` yields a simulator .app — installable on a Mac, not on a phone
#   Once enrolled, add the certs to secrets and switch `ios` to `flutter build ipa`.
# ==============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      targets:
        description: 'Targets: android / ios / sim / all, comma-separated (main branch only)'
        type: string
        default: 'android'
      release:
        description: 'Tag the commit and publish a GitHub Release'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.4'

permissions:
  contents: read

jobs:
  trigger:
    name: Resolve trigger
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.parse.outputs.android }}
      ios: ${{ steps.parse.outputs.ios }}
      sim: ${{ steps.parse.outputs.sim }}
      release: ${{ steps.parse.outputs.release }}
      version: ${{ steps.parse.outputs.version }}
      build_name: ${{ steps.parse.outputs.build_name }}
      build_number: ${{ steps.parse.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Parse trigger
        id: parse
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TARGETS: ${{ inputs.targets }}
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail

          VERSION_RE='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\+[1-9][0-9]*'
          TARGETS_RE='(android|ios|sim)(,(android|ios|sim))*|all'

          targets=""
          version=""
          release=false

          pubspec_version="$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/^version:[[:space:]]*//' | tr -d '[:space:]')"
          echo "pubspec.yaml version: $pubspec_version"

          on_main=false
          if [ "$REF_NAME" = "main" ] && { [ "$EVENT" = "push" ] || [ "$EVENT" = "workflow_dispatch" ]; }; then
            on_main=true
          fi

          if [ "$EVENT" = "workflow_dispatch" ]; then
            targets="$INPUT_TARGETS"
            version="$pubspec_version"
            release="$INPUT_RELEASE"
            if ! printf '%s' "$targets" | grep -Eq "^(${TARGETS_RE})\$"; then
              echo "::error::Targets '$targets' invalid. Use a comma-separated subset of android,ios,sim (no spaces), or all."
              exit 1
            fi
            echo "Manual run: targets=$targets release=$release version=$version"
          else
            subject="$(git log -1 --pretty=%s)"
            echo "Commit subject: $subject"

            if printf '%s' "$subject" | grep -Eq "^build\((${TARGETS_RE})\): ${VERSION_RE}\$"; then
              targets="$(printf '%s' "$subject" | sed -E 's/^build\((.*)\): .*$/\1/')"
              version="$(printf '%s' "$subject" | sed -E 's/^build\(.*\): //')"
              release=true
              echo "Matched build trigger: targets=$targets version=$version"
            elif printf '%s' "$subject" | grep -Eqi '^build'; then
              echo "::error::Commit subject starts with 'build' but does not match the required grammar."
              echo "::error::Required: build(<targets>): <x.y.z>+<build>"
              echo "::error::  <targets> = comma-separated subset of android,ios,sim (no spaces), or all"
              echo "::error::  e.g.  build(android): 1.4.0+12   |   build(android,sim): 1.4.0+12"
              echo "::error::Got:      $subject"
              exit 1
            else
              echo "No build trigger in commit subject — analyze & test only."
            fi
          fi

          android=false
          ios=false
          sim=false

          if [ "$targets" = "all" ]; then
            android=true; ios=true; sim=true
          elif [ -n "$targets" ]; then
            # Reject duplicates: the regex allows android,android, which is
            # almost certainly a mistake and should not pass silently.
            count_total="$(printf '%s\n' "$targets" | tr ',' '\n' | wc -l | tr -d ' ')"
            count_uniq="$(printf '%s\n' "$targets" | tr ',' '\n' | sort -u | wc -l | tr -d ' ')"
            if [ "$count_total" != "$count_uniq" ]; then
              echo "::error::Targets '$targets' contains a duplicate."
              exit 1
            fi
            for t in $(printf '%s' "$targets" | tr ',' ' '); do
              case "$t" in
                android) android=true ;;
                ios)     ios=true ;;
                sim)     sim=true ;;
              esac
            done
          fi

          if [ "$android" = false ] && [ "$ios" = false ] && [ "$sim" = false ]; then
            release=false
          fi

          # Validate even when we are not going to build, so a bad trigger on a
          # feature branch fails now instead of after the merge.
          if [ "$release" = true ] || [ "$android" = true ] || [ "$ios" = true ] || [ "$sim" = true ]; then
            if [ "$version" != "$pubspec_version" ]; then
              echo "::error::Version mismatch — trigger says '$version' but pubspec.yaml says '$pubspec_version'."
              echo "::error::Bump pubspec.yaml and the commit subject together."
              exit 1
            fi
            if ! grep -Eq "^## \[${version//+/\\+}\]( |\$)" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no section for '$version'."
              echo "::error::Add a heading '## [$version] - $(date -u +%Y-%m-%d)' with the release notes."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
              echo "::error::Tag 'v$version' already exists — version '$version' has been released."
              echo "::error::Bump pubspec.yaml, CHANGELOG.md and the commit subject to a new version."
              exit 1
            fi
          fi

          if [ "$on_main" != true ]; then
            if [ "$android" = true ] || [ "$ios" = true ] || [ "$sim" = true ]; then
              echo "::notice::Trigger is valid, but builds only run on main. Nothing will be built for '$REF_NAME'."
            fi
            android=false; ios=false; sim=false; release=false
          fi

          build_name=""
          build_number=""
          if [ "$android" = true ] || [ "$ios" = true ] || [ "$sim" = true ]; then
            build_name="${version%%+*}"
            build_number="${version##*+}"
          else
            version=""
          fi

          {
            echo "android=$android"
            echo "ios=$ios"
            echo "sim=$sim"
            echo "release=$release"
            echo "version=$version"
            echo "build_name=$build_name"
            echo "build_number=$build_number"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### CI triggers"
            echo ""
            echo "| Job | Status |"
            echo "| --- | --- |"
            echo "| Analyze & Test | :white_check_mark: always |"
            echo "| APK | ${{ steps.parse.outputs.android == 'true' && ':white_check_mark: build' || ':heavy_minus_sign: skipped' }} |"
            echo "| iOS device (unsigned) | ${{ steps.parse.outputs.ios == 'true' && ':white_check_mark: build' || ':heavy_minus_sign: skipped' }} |"
            echo "| iOS Simulator (debug) | ${{ steps.parse.outputs.sim == 'true' && ':white_check_mark: build' || ':heavy_minus_sign: skipped' }} |"
            echo "| Release | ${{ steps.parse.outputs.release == 'true' && ':white_check_mark: publish' || ':heavy_minus_sign: skipped' }} |"
            echo ""
            if [ -n "${{ steps.parse.outputs.version }}" ]; then
              echo "Version: \`${{ steps.parse.outputs.version }}\` → tag \`v${{ steps.parse.outputs.version }}\`"
            else
              echo "To build and release, push to \`main\` with a commit subject of the exact form \`build(<targets>): <x.y.z>+<build>\` — e.g. \`build(android): 1.4.0+12\` — matching pubspec.yaml and CHANGELOG.md."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Build APK ${{ needs.trigger.outputs.version }}
    needs: [trigger, analyze]
    if: needs.trigger.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name=${{ needs.trigger.outputs.build_name }} \
            --build-number=${{ needs.trigger.outputs.build_number }}
          mv build/app/outputs/flutter-apk/app-release.apk \
             "wayback-${{ needs.trigger.outputs.build_name }}-${{ needs.trigger.outputs.build_number }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: wayback-*.apk
          retention-days: 14

  build-ios:
    name: Build iOS device ${{ needs.trigger.outputs.version }}
    needs: [trigger, analyze]
    if: needs.trigger.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Unsigned arm64 device build. It is NOT installable on any iPhone —
      # this job exists to prove the iOS target compiles. See CODESIGNING above.
      - name: Build iOS (device, unsigned)
        run: |
          flutter build ios --release --no-codesign \
            --build-name=${{ needs.trigger.outputs.build_name }} \
            --build-number=${{ needs.trigger.outputs.build_number }}
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app \
            "wayback-ios-${{ needs.trigger.outputs.build_name }}-${{ needs.trigger.outputs.build_number }}-unsigned.zip"

      - name: Upload iOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: wayback-ios-*.zip
          retention-days: 14

  build-ios-sim:
    name: Build iOS Simulator ${{ needs.trigger.outputs.version }}
    needs: [trigger, analyze]
    if: needs.trigger.outputs.sim == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Simulator slice, x86_64/arm64 against the iphonesimulator SDK.
      # `--simulator` forces debug mode: Flutter cannot AOT-compile for the
      # simulator, so a release simulator build does not exist.
      - name: Build iOS (simulator, debug)
        run: |
          flutter build ios --simulator --debug \
            --build-name=${{ needs.trigger.outputs.build_name }} \
            --build-number=${{ needs.trigger.outputs.build_number }}
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphonesimulator/Runner.app \
            "wayback-ios-sim-${{ needs.trigger.outputs.build_name }}-${{ needs.trigger.outputs.build_number }}-debug.zip"

      - name: Upload simulator bundle
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim
          path: wayback-ios-sim-*.zip
          retention-days: 14

  release:
    name: Release v${{ needs.trigger.outputs.version }}
    needs: [trigger, build-android, build-ios, build-ios-sim]
    if: |
      always()
      && needs.trigger.outputs.release == 'true'
      && needs.build-android.result != 'failure' && needs.build-android.result != 'cancelled'
      && needs.build-ios.result != 'failure' && needs.build-ios.result != 'cancelled'
      && needs.build-ios-sim.result != 'failure' && needs.build-ios-sim.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '{apk,ios,ios-sim}'
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.trigger.outputs.version }}
          SIM: ${{ needs.trigger.outputs.sim }}
          IOS: ${{ needs.trigger.outputs.ios }}
        run: |
          set -euo pipefail
          awk -v ver="## [$VERSION]" '
            index($0, ver) == 1 { found = 1; next }
            found && /^## \[/    { exit }
            found                { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md

          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md section for '$VERSION' is empty."
            exit 1
          fi

          if [ "$SIM" = true ]; then
            {
              echo ""
              echo "---"
              echo ""
              echo "**Сборка для симулятора iOS** (debug). Распаковать и на Mac выполнить:"
              echo '```bash'
              echo "xcrun simctl install booted Runner.app && xcrun simctl launch booted com.dogayo.wayback"
              echo '```'
            } >> notes.md
          fi
          if [ "$IOS" = true ]; then
            {
              echo ""
              echo "> Файл \`*-unsigned.zip\` — неподписанная сборка под устройство. На iPhone не ставится, приложена как подтверждение сборки."
            } >> notes.md
          fi

          echo "Release notes:"; cat notes.md

      - name: Create tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.trigger.outputs.version }}
        run: |
          set -euo pipefail
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"

          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            dist/*
