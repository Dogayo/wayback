# ==============================================================================
# CI
#
# NOTHING runs on a plain push or pull request. GitHub decides whether to
# create a workflow run from the `on:` filters alone, BEFORE any of this file
# executes — and those filters can only match branches, tags and paths, never
# the text of a commit message. A tag is therefore the only way to say "run
# now" without producing a run for every commit.
#
# Pull requests into main are checked separately by pr.yml (format,
# analyze, tests — no builds). A plain push without a PR still gets no signal.
#
# ------------------------------------------------------------------------------
# TAG GRAMMAR (exact match, lowercase)
#
#     v<major>.<minor>.<patch>+<build>[-<targets>]
#
#   <targets>  optional, comma-separated, no spaces, no duplicates:
#
#       android   release APK. Installable. This is the default when the
#                 suffix is omitted.
#       ios       release .app for a device, UNSIGNED — cannot be installed on
#                 any iPhone. Opt-in: it only proves the target compiles.
#       sim       debug .app for the iOS Simulator. Opt-in: installable on a
#                 Mac via `xcrun simctl install`, but debug-mode and large.
#
#     `all` is accepted as an alias for `android,ios,sim`.
#
#   Valid:
#     v1.4.0+12                 -> APK only
#     v1.4.0+12-sim             -> simulator build only
#     v1.4.0+12-android,sim     -> APK + simulator
#     v1.4.0+12-all             -> everything
#
#   Invalid — these FAIL the run with an explicit error rather than skipping:
#     v1.4.0                    <- missing +build
#     1.4.0+12                  <- missing leading v
#     v1.4.0+12-android,android <- duplicate target
#     v1.4.0+12-web             <- unknown target
#     v1.4.0+12-android, sim    <- space after comma
#
#   Neither `ios` nor `sim` is ever built unless named explicitly, because
#   neither produces an artifact installable on a phone. See CODESIGNING below.
#
# ------------------------------------------------------------------------------
# VERSION BINDING — three things must agree, or the run fails before building
#
#   1. the version in the tag
#   2. `version:` in pubspec.yaml at the tagged commit
#   3. a `## [<version>] - <date>` section in CHANGELOG.md
#
#   The version is passed to Flutter as --build-name / --build-number, so the
#   shipped binary cannot disagree with the repo. Bump all three, commit, tag.
#
#   Because the tag is what starts the run, CI does NOT create tags. You do:
#
#       git commit -am "release 1.4.0+12"
#       git tag v1.4.0+12-android,sim
#       git push origin main --follow-tags
#
#   The trade-off is deliberate: a tag pushed by hand means no run is ever
#   created for an ordinary commit. The cost is that a tag can point at a
#   commit that does not build — the run then fails and no Release is created,
#   so delete the tag, fix, and re-tag.
#
# ------------------------------------------------------------------------------
# RELEASES
#
#   After the builds succeed, CI publishes a GitHub Release on the tag, with
#   the CHANGELOG section as its notes and the built artifacts attached.
#
# ------------------------------------------------------------------------------
# MANUAL RUNS
#
#   `Run workflow` builds any targets from any ref for a quick check. It never
#   tags and never publishes a Release — artifacts land on the run itself.
#
# ------------------------------------------------------------------------------
# CODESIGNING
#
#   Team PX65354M6J has no Apple Developer Program membership, so no
#   distribution certificate or App Store profile can be issued and CI cannot
#   sign anything. Until the account is enrolled:
#     - `ios` yields an unsigned device .app — not installable, compile check only
#     - `sim` yields a simulator .app — installable on a Mac, not on a phone
#   Once enrolled, add the certs to secrets and switch `ios` to `flutter build ipa`.
# ==============================================================================

name: CI

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      targets:
        description: 'Targets: android / ios / sim / all, comma-separated'
        type: string
        default: 'android'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.4'

permissions:
  contents: read

jobs:
  trigger:
    name: Resolve trigger
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.parse.outputs.android }}
      ios: ${{ steps.parse.outputs.ios }}
      sim: ${{ steps.parse.outputs.sim }}
      release: ${{ steps.parse.outputs.release }}
      version: ${{ steps.parse.outputs.version }}
      build_name: ${{ steps.parse.outputs.build_name }}
      build_number: ${{ steps.parse.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse trigger
        id: parse
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail

          VERSION_RE='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\+[1-9][0-9]*'
          TARGETS_RE='(android|ios|sim)(,(android|ios|sim))*|all'

          pubspec_version="$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/^version:[[:space:]]*//' | tr -d '[:space:]')"
          echo "pubspec.yaml version: $pubspec_version"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            targets="$INPUT_TARGETS"
            version="$pubspec_version"
            release=false
            if ! printf '%s' "$targets" | grep -Eq "^(${TARGETS_RE})\$"; then
              echo "::error::Targets '$targets' invalid. Use a comma-separated subset of android,ios,sim (no spaces), or all."
              exit 1
            fi
            echo "Manual run: targets=$targets version=$version (no release)"
          else
            if [ "$REF_TYPE" != "tag" ]; then
              echo "::error::Expected a tag ref, got '$REF_TYPE' '$REF_NAME'."
              exit 1
            fi
            if ! printf '%s' "$REF_NAME" | grep -Eq "^v${VERSION_RE}(-(${TARGETS_RE}))?\$"; then
              echo "::error::Tag '$REF_NAME' does not match the required grammar."
              echo "::error::Required: v<x.y.z>+<build>[-<targets>]"
              echo "::error::  <targets> = comma-separated subset of android,ios,sim (no spaces), or all"
              echo "::error::  e.g.  v1.4.0+12   |   v1.4.0+12-android,sim   |   v1.4.0+12-all"
              exit 1
            fi
            # Split on the FIRST '-' only; the version itself contains none.
            version="$(printf '%s' "${REF_NAME#v}" | cut -d- -f1)"
            targets="$(printf '%s' "${REF_NAME#v}" | cut -s -d- -f2-)"
            targets="${targets:-android}"
            release=true
            echo "Tag run: targets=$targets version=$version"
          fi

          android=false
          ios=false
          sim=false

          if [ "$targets" = "all" ]; then
            android=true; ios=true; sim=true
          else
            # The regex permits android,android; a duplicate is almost certainly
            # a mistake and must not pass silently.
            count_total="$(printf '%s\n' "$targets" | tr ',' '\n' | wc -l | tr -d ' ')"
            count_uniq="$(printf '%s\n' "$targets" | tr ',' '\n' | sort -u | wc -l | tr -d ' ')"
            if [ "$count_total" != "$count_uniq" ]; then
              echo "::error::Targets '$targets' contains a duplicate."
              exit 1
            fi
            for t in $(printf '%s' "$targets" | tr ',' ' '); do
              case "$t" in
                android) android=true ;;
                ios)     ios=true ;;
                sim)     sim=true ;;
                *) echo "::error::Unknown target '$t'"; exit 1 ;;
              esac
            done
          fi

          if [ "$version" != "$pubspec_version" ]; then
            echo "::error::Version mismatch — trigger says '$version' but pubspec.yaml says '$pubspec_version'."
            echo "::error::Bump pubspec.yaml and re-tag so the binary matches the repo."
            exit 1
          fi
          if ! grep -Eq "^## \[${version//+/\\+}\]( |\$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for '$version'."
            echo "::error::Add a heading '## [$version] - $(date -u +%Y-%m-%d)' with the release notes."
            exit 1
          fi

          {
            echo "android=$android"
            echo "ios=$ios"
            echo "sim=$sim"
            echo "release=$release"
            echo "version=$version"
            echo "build_name=${version%%+*}"
            echo "build_number=${version##*+}"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### CI run"
            echo ""
            echo "| Job | Status |"
            echo "| --- | --- |"
            echo "| Analyze & Test | :white_check_mark: always |"
            echo "| APK | ${{ steps.parse.outputs.android == 'true' && ':white_check_mark: build' || ':heavy_minus_sign: skipped' }} |"
            echo "| iOS device (unsigned) | ${{ steps.parse.outputs.ios == 'true' && ':white_check_mark: build' || ':heavy_minus_sign: skipped' }} |"
            echo "| iOS Simulator (debug) | ${{ steps.parse.outputs.sim == 'true' && ':white_check_mark: build' || ':heavy_minus_sign: skipped' }} |"
            echo "| Release | ${{ steps.parse.outputs.release == 'true' && ':white_check_mark: publish' || ':heavy_minus_sign: manual run' }} |"
            echo ""
            echo "Version: \`${{ steps.parse.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  analyze:
    name: Analyze & Test
    needs: trigger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Build APK ${{ needs.trigger.outputs.version }}
    needs: [trigger, analyze]
    if: needs.trigger.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The upload key comes from secrets (docs/android-signing.md §7). A tag
      # release without it fails: a debug-signed APK can't update an install
      # signed with the real key. A manual run falls back to the debug key.
      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE: ${{ needs.trigger.outputs.release }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$RELEASE" = true ]; then
              echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set; a release must be signed with the upload key."
              exit 1
            fi
            echo "::warning::No upload keystore in secrets — this manual build is signed with the debug key."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload.jks
          EOF

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name=${{ needs.trigger.outputs.build_name }} \
            --build-number=${{ needs.trigger.outputs.build_number }}
          mv build/app/outputs/flutter-apk/app-release.apk \
             "wayback-${{ needs.trigger.outputs.build_name }}-${{ needs.trigger.outputs.build_number }}.apk"

      - name: Verify signature
        env:
          RELEASE: ${{ needs.trigger.outputs.release }}
        run: |
          set -euo pipefail
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          certs="$("$apksigner" verify --print-certs wayback-*.apk)"
          echo "$certs" | grep -E 'certificate (DN|SHA-256 digest)'
          if [ "$RELEASE" = true ] && echo "$certs" | grep -q 'CN=Android Debug'; then
            echo "::error::The release APK is signed with the debug key."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: wayback-*.apk
          retention-days: 14

  build-ios:
    name: Build iOS device ${{ needs.trigger.outputs.version }}
    needs: [trigger, analyze]
    if: needs.trigger.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Unsigned arm64 device build. NOT installable on any iPhone — this job
      # exists to prove the iOS target compiles. See CODESIGNING above.
      - name: Build iOS (device, unsigned)
        run: |
          flutter build ios --release --no-codesign \
            --build-name=${{ needs.trigger.outputs.build_name }} \
            --build-number=${{ needs.trigger.outputs.build_number }}
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app \
            "wayback-ios-${{ needs.trigger.outputs.build_name }}-${{ needs.trigger.outputs.build_number }}-unsigned.zip"

      - name: Upload iOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: wayback-ios-*.zip
          retention-days: 14

  build-ios-sim:
    name: Build iOS Simulator ${{ needs.trigger.outputs.version }}
    needs: [trigger, analyze]
    if: needs.trigger.outputs.sim == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Simulator slice, built against the iphonesimulator SDK. `--simulator`
      # forces debug: Flutter cannot AOT-compile for the simulator, so a
      # release simulator build does not exist.
      - name: Build iOS (simulator, debug)
        run: |
          flutter build ios --simulator --debug \
            --build-name=${{ needs.trigger.outputs.build_name }} \
            --build-number=${{ needs.trigger.outputs.build_number }}
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphonesimulator/Runner.app \
            "wayback-ios-sim-${{ needs.trigger.outputs.build_name }}-${{ needs.trigger.outputs.build_number }}-debug.zip"

      - name: Upload simulator bundle
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim
          path: wayback-ios-sim-*.zip
          retention-days: 14

  release:
    name: Release v${{ needs.trigger.outputs.version }}
    needs: [trigger, build-android, build-ios, build-ios-sim]
    if: |
      always()
      && needs.trigger.outputs.release == 'true'
      && needs.build-android.result != 'failure' && needs.build-android.result != 'cancelled'
      && needs.build-ios.result != 'failure' && needs.build-ios.result != 'cancelled'
      && needs.build-ios-sim.result != 'failure' && needs.build-ios-sim.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '{apk,ios,ios-sim}'
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.trigger.outputs.version }}
          SIM: ${{ needs.trigger.outputs.sim }}
          IOS: ${{ needs.trigger.outputs.ios }}
        run: |
          set -euo pipefail
          awk -v ver="## [$VERSION]" '
            index($0, ver) == 1 { found = 1; next }
            found && /^## \[/    { exit }
            found                { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md

          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md section for '$VERSION' is empty."
            exit 1
          fi

          if [ "$SIM" = true ]; then
            {
              echo ""
              echo "---"
              echo ""
              echo "**Сборка для симулятора iOS** (debug). Распаковать и на Mac выполнить:"
              echo '```bash'
              echo "xcrun simctl install booted Runner.app && xcrun simctl launch booted com.dogayo.wayback"
              echo '```'
            } >> notes.md
          fi
          if [ "$IOS" = true ]; then
            {
              echo ""
              echo "> Файл \`*-unsigned.zip\` — неподписанная сборка под устройство. На iPhone не ставится, приложена как подтверждение сборки."
            } >> notes.md
          fi

          echo "Release notes:"; cat notes.md

      # The tag already exists — it is what started this run. Only the Release
      # is created here, once the builds are green.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.trigger.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "v$VERSION" \
            --notes-file notes.md \
            dist/*
